<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Open Design — Engineering Docs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-theme" />
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  /* ── Design tokens ── */
  :root {
    --canvas:       #faf9f5;
    --card-bg:      #ffffff;
    --warm-surface: #f3f0e8;
    --coral:        #c96442;
    --coral-light:  #faece7;
    --coral-dark:   #993c1d;
    --navy:         #1c2333;
    --text-primary: #1a1916;
    --text-body:    #3d3a34;
    --text-muted:   #706d65;
    --text-faint:   #a09c94;
    --border:       rgba(28,35,51,0.09);
    --sidebar-w:    272px;
    --header-h:     58px;
    --radius:       8px;
    --shadow-sm:    0 1px 3px rgba(28,35,51,0.08), 0 1px 2px rgba(28,35,51,0.06);
    --shadow-md:    0 4px 12px rgba(28,35,51,0.10);
    --transition:   0.18s ease;
  }

  /* ── Reset / base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--canvas);
    color: var(--text-body);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Layout ── */
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ── Header ── */
  #header {
    position: sticky; top: 0; z-index: 100;
    height: var(--header-h);
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px;
    box-shadow: var(--shadow-sm);
  }
  #header-logo {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; flex-shrink: 0;
  }
  #header-logo svg { width: 28px; height: 28px; }
  #header-wordmark {
    font-family: 'Lora', serif;
    font-size: 15px; font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
  }
  #header-wordmark span {
    color: var(--text-muted);
    font-weight: 400;
  }
  #header-divider {
    width: 1px; height: 22px;
    background: var(--border);
    flex-shrink: 0;
  }
  #search-wrap {
    flex: 1; max-width: 320px;
    position: relative;
  }
  #search-wrap svg {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--text-faint); pointer-events: none;
  }
  #nav-search {
    width: 100%;
    padding: 7px 12px 7px 34px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--warm-surface);
    color: var(--text-body);
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  #nav-search:focus {
    border-color: var(--coral);
    box-shadow: 0 0 0 3px var(--coral-light);
    background: var(--card-bg);
  }
  #header-pills {
    display: flex; gap: 8px; flex-shrink: 0;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--warm-surface);
    border: 1px solid var(--border);
    font-size: 12px; font-weight: 500;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .pill-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--coral);
    flex-shrink: 0;
  }
  #header-github {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-body);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    text-decoration: none;
    transition: background var(--transition), border-color var(--transition);
    flex-shrink: 0;
  }
  #header-github:hover {
    background: var(--warm-surface);
    border-color: var(--text-muted);
  }

  /* ── Body layout ── */
  #body { display: flex; flex: 1; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--card-bg);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 0 32px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .nav-section-label {
    padding: 12px 18px 4px;
    font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    user-select: none;
  }
  .nav-section-label:not(:first-child) {
    margin-top: 8px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 18px;
    cursor: pointer;
    border-radius: 0;
    font-size: 13.5px;
    color: var(--text-body);
    transition: background var(--transition), color var(--transition);
    border: none; background: none;
    width: 100%; text-align: left;
    position: relative;
  }
  .nav-item:hover {
    background: var(--warm-surface);
    color: var(--text-primary);
  }
  .nav-item.active {
    background: var(--coral-light);
    color: var(--coral-dark);
    font-weight: 500;
  }
  .nav-item.active::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--coral);
    border-radius: 0 2px 2px 0;
  }
  .nav-item.hidden { display: none; }
  .nav-num {
    font-size: 11px; font-weight: 600;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
    min-width: 22px;
  }
  .nav-label { flex: 1; }
  .badge-new {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 10px;
    background: var(--coral);
    color: #fff;
    font-size: 9.5px; font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  /* ── Main content ── */
  #main {
    flex: 1; overflow-y: auto;
    padding: 0;
    display: flex; flex-direction: column;
  }
  #content-area {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 48px 80px;
    width: 100%;
  }
  #content-area.diagram-mode {
    max-width: none;
    margin: 0;
    padding: 18px 20px 24px;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  #content-area.diagram-mode.dataflow-mode {
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 48px 80px;
    flex: initial;
    min-height: auto;
    display: block;
  }

  /* ── Welcome screen ── */
  #welcome { }
  .welcome-hero {
    margin-bottom: 36px;
  }
  .welcome-hero h1 {
    font-family: 'Lora', serif;
    font-size: 28px; font-weight: 700;
    color: var(--text-primary);
    line-height: 1.25;
    margin-bottom: 10px;
  }
  .welcome-hero p {
    font-size: 15px;
    color: var(--text-muted);
    max-width: 560px;
    line-height: 1.6;
  }
  .reading-order-notice {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 18px;
    background: var(--coral-light);
    border: 1px solid rgba(201,100,66,0.2);
    border-radius: var(--radius);
    margin-bottom: 36px;
    font-size: 13.5px;
    color: var(--coral-dark);
    line-height: 1.55;
  }
  .reading-order-notice svg { flex-shrink: 0; margin-top: 1px; }
  .artifact-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .artifact-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    cursor: pointer;
    transition: box-shadow var(--transition), border-color var(--transition), transform var(--transition);
  }
  .artifact-card:hover {
    box-shadow: var(--shadow-md);
    border-color: rgba(201,100,66,0.25);
    transform: translateY(-1px);
  }
  .card-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 500;
    color: var(--text-faint);
    margin-bottom: 6px;
  }
  .card-title {
    font-family: 'Lora', serif;
    font-size: 15px; font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 6px;
    line-height: 1.3;
  }
  .card-desc {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
  }
  .card-type {
    display: inline-block;
    margin-top: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--warm-surface);
    font-size: 11px; font-weight: 500;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
  }
  .card-new { border-color: rgba(201,100,66,0.35); }
  .card-new .card-num { color: var(--coral); }

  /* ── Mermaid / diagram area ── */
  #mmd-area {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    overflow: hidden;
    min-height: 0;
  }
  #content-area.diagram-mode #mmd-area {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  #content-area.diagram-mode.dataflow-mode #mmd-area {
    display: block;
    flex: initial;
    min-height: auto;
    padding: 32px 24px;
  }
  #mmd-title {
    font-family: 'Lora', serif;
    font-size: 20px; font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 12px;
  }
  #content-area.diagram-mode.dataflow-mode #mmd-title {
    margin-bottom: 20px;
  }
  #mmd-loading {
    text-align: center;
    padding: 60px 0;
    color: var(--text-muted);
    font-size: 14px;
  }
  #mmd-render { min-width: 0; }
  #content-area.diagram-mode #mmd-render {
    flex: 1;
    min-height: 0;
    display: flex;
  }
  #content-area.diagram-mode.dataflow-mode #mmd-render {
    display: block;
    flex: initial;
    min-height: auto;
  }
  .diagram-fit {
    overflow: auto;
    width: 100%;
    max-height: calc(100vh - 190px);
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: rgba(243,240,232,0.24);
    text-align: center;
  }
  #content-area.diagram-mode .diagram-fit {
    flex: 1;
    max-height: none;
    min-height: 0;
  }
  #content-area.diagram-mode.dataflow-mode .diagram-fit {
    flex: initial;
    max-height: calc(100vh - 230px);
    min-height: auto;
    padding: 18px;
  }
  .diagram-fit svg {
    display: inline-block;
    width: 100% !important;
    max-width: 100% !important;
    height: auto !important;
  }

  /* ── Markdown content ── */
  #md-content {
    /* rendered markdown lives here */
  }
  #md-content h1 {
    font-family: 'Lora', serif;
    font-size: 26px; font-weight: 700;
    color: var(--text-primary);
    margin: 0 0 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--border);
    line-height: 1.25;
  }
  #md-content h2 {
    font-family: 'Lora', serif;
    font-size: 20px; font-weight: 600;
    color: var(--text-primary);
    margin: 36px 0 12px;
    line-height: 1.3;
  }
  #md-content h3 {
    font-family: 'DM Sans', sans-serif;
    font-size: 15.5px; font-weight: 600;
    color: var(--text-primary);
    margin: 24px 0 8px;
    line-height: 1.35;
  }
  #md-content h4 {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 600;
    color: var(--text-muted);
    margin: 18px 0 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  #md-content p {
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--text-body);
    margin-bottom: 14px;
  }
  #md-content a {
    color: var(--coral);
    text-decoration: none;
    border-bottom: 1px solid var(--coral-light);
    transition: border-color var(--transition);
  }
  #md-content a:hover { border-bottom-color: var(--coral); }
  #md-content ul, #md-content ol {
    padding-left: 22px;
    margin-bottom: 14px;
  }
  #md-content li {
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--text-body);
    margin-bottom: 4px;
  }
  #md-content li > ul, #md-content li > ol { margin-top: 4px; margin-bottom: 4px; }
  #md-content blockquote {
    margin: 18px 0;
    padding: 12px 18px;
    border-left: 4px solid var(--coral);
    background: var(--coral-light);
    border-radius: 0 var(--radius) var(--radius) 0;
    color: var(--coral-dark);
    font-size: 14px;
    line-height: 1.6;
  }
  #md-content blockquote p {
    color: var(--coral-dark);
    margin-bottom: 0;
    font-size: 14px;
  }
  #md-content hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 32px 0;
  }
  #md-content table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    margin-bottom: 20px;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
  }
  #md-content th {
    background: var(--warm-surface);
    padding: 9px 14px;
    text-align: left;
    font-weight: 600;
    color: var(--text-primary);
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border);
  }
  #md-content td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text-body);
    vertical-align: top;
  }
  #md-content tr:last-child td { border-bottom: none; }
  #md-content tr:nth-child(even) td { background: rgba(243,240,232,0.3); }
  #md-content code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    background: var(--warm-surface);
    color: var(--coral-dark);
    padding: 1px 5px;
    border-radius: 3px;
    border: 1px solid var(--border);
  }
  #md-content pre {
    background: var(--navy) !important;
    border-radius: var(--radius);
    padding: 20px 22px;
    margin: 16px 0 20px;
    overflow-x: auto;
    box-shadow: var(--shadow-sm);
  }
  #md-content pre code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.6;
    background: none !important;
    color: #e2e8f0 !important;
    padding: 0;
    border: none;
  }
  /* Mermaid blocks inside markdown */
  #md-content .mermaid-block {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin: 20px 0;
    overflow: visible;
  }
  #md-content .mermaid-block .diagram-fit {
    max-height: none;
    overflow: auto;
    text-align: left;
  }
  #md-content .mermaid-block .diagram-fit svg {
    width: auto !important;
    min-width: 100%;
    max-width: none !important;
  }

  /* ── Grid section headers ── */
  .grid-section-header {
    grid-column: 1 / -1;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 20px 0 6px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }
  .grid-section-header:first-child { padding-top: 0; }

  /* ── Loading / error states ── */
  .loading-msg {
    text-align: center; padding: 80px 0;
    color: var(--text-muted); font-size: 14px;
  }
  .error-msg {
    padding: 24px;
    background: #fff2f0;
    border: 1px solid #ffa39e;
    border-radius: var(--radius);
    color: #820014;
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── Footer ── */
  #footer {
    padding: 14px 48px;
    border-top: 1px solid var(--border);
    background: var(--card-bg);
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
  }
  .footer-left {
    display: flex; align-items: center; gap: 16px;
    font-size: 12px;
    color: var(--text-faint);
  }
  .footer-sep { color: var(--border); }
  .footer-active-file {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--text-faint);
  }

  /* ── Highlight.js dark theme override ── */
  .hljs {
    background: var(--navy) !important;
    color: #e2e8f0 !important;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(112,109,101,0.35); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(112,109,101,0.55); }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    #content-area { padding: 28px 24px 60px; }
    #content-area.diagram-mode { padding: 12px; }
    #content-area.diagram-mode.dataflow-mode { padding: 28px 24px 60px; }
    #footer { padding: 12px 24px; }
  }
  @media (max-width: 640px) {
    #sidebar { display: none; }
    #header-pills { display: none; }
    #header-github { display: none; }
    .diagram-fit { padding: 10px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ── HEADER ── -->
  <header id="header">
    <a id="header-logo" href="#" onclick="showWelcome(event)">
      <!-- Spike-mark SVG logo -->
      <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="28" height="28" rx="6" fill="#c96442"/>
        <path d="M7 20 L14 6 L21 20" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M9.5 15.5 L18.5 15.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <circle cx="14" cy="6" r="1.8" fill="white"/>
      </svg>
      <span id="header-wordmark">Open Design <span>/ Engineering Docs</span></span>
    </a>
    <div id="header-divider"></div>
    <div id="search-wrap">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M9 3a6 6 0 100 12A6 6 0 009 3zm-8 6a8 8 0 1114.32 4.906l4.387 4.387a1 1 0 01-1.414 1.414l-4.387-4.387A8 8 0 011 9z" clip-rule="evenodd"/>
      </svg>
      <input type="search" id="nav-search" placeholder="Filter docs…" oninput="filterNav(this.value)" autocomplete="off" />
    </div>
    <div id="header-pills">
      <span class="pill"><span class="pill-dot"></span>31 Skills</span>
      <span class="pill"><span class="pill-dot"></span>72 Design Systems</span>
    </div>
    <div id="header-divider" style="margin-left:auto"></div>
    <a id="header-github" href="https://github.com" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
      </svg>
      GitHub
    </a>
  </header>

  <!-- ── BODY ── -->
  <div id="body">

    <!-- ── SIDEBAR ── -->

  breaks: false,
  gfm: true,
});

const markdownRenderer = new marked.Renderer();
let activeMarkdownScope = 'markdown';
let activeMermaidIndex = 0;

markdownRenderer.code = function(tokenOrCode, infostring) {
  const code = typeof tokenOrCode === 'object' && tokenOrCode !== null
    ? tokenOrCode.text || ''
    : tokenOrCode || '';
  const rawLang = typeof tokenOrCode === 'object' && tokenOrCode !== null
    ? tokenOrCode.lang || ''
    : infostring || '';
  const lang = String(rawLang).trim().split(/\s+/)[0].toLowerCase();

  if (lang === 'mermaid') {
    const index = activeMermaidIndex++;
    const key = `${activeMarkdownScope}:inline:${index}:${hashString(code)}`;
    return `<div class="mermaid-block" data-mmd-key="${escapeAttr(key)}" data-mmd-code="${escapeAttr(code)}"><div style="color:var(--text-muted);font-size:13px;padding:20px">Rendering diagram…</div></div>`;
  }

  const langClass = lang ? ` class="language-${escapeHtml(lang)}"` : '';
  return `<pre><code${langClass}>${escapeHtml(code)}</code></pre>`;
};

marked.use({ renderer: markdownRenderer });

// ── Nav filter ──
function filterNav(q) {
  const query = q.toLowerCase().trim();
  getNavIndex().forEach(item => {
    if (!query) { item.el.classList.remove('hidden'); return; }
    item.el.classList.toggle('hidden', !item.searchText.includes(query));
  });
}

// ── Nav activation ──
function setActive(el) {
  if (activeNavEl) activeNavEl.classList.remove('active');
  if (el) { el.classList.add('active'); activeNavEl = el; }
}

  const contentArea = byId('content-area');

function loadWelcome(el) {
  nextRenderRun();
  if (el) setActive(el);
  showArea('welcome');
  byId('footer-file').textContent = 'index.html';

  const welcome = byId('welcome');
  if (welcomeRendered) {
    byId('main').scrollTop = 0;
    return;
  }

  welcomeRendered = true;
  welcome.innerHTML = `
    <div class="welcome-hero">
      <h1>Open Design — Engineering Documentation</h1>
      <p>38 artifacts: 11 data flow diagrams · 10 sequence diagrams · 5 system charts · 9 markdown references. Covering the daemon architecture, 16 agent adapters, skill system, security model, and all extension points.</p>
    </div>
    <div class="reading-order-notice">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" style="margin-top:1px;flex-shrink:0" aria-hidden="true">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
      </svg>
      <div><strong>Recommended starting points —</strong> <strong>New to the repo?</strong> Read AR (Architecture Overview) → RS (Runtime Sequence) → D01 (Backend Deep Dive). <strong>Tracing a specific flow?</strong> Go to Data Flows DF01–DF11 — each maps to one of the 11 flows in the Data Flow Map doc. <strong>Debugging a protocol?</strong> Sequence Diagrams SD01–SD10 trace actor-level interactions. <strong>Extending the system?</strong> Read D08 (Extension Points) + D04 (Agentic Platform).</div>
    </div>
    <div class="artifact-grid" id="artifact-grid"></div>
  `;

  const grid = byId('artifact-grid');
  let currentSection = null;
  ARTIFACTS.forEach(a => {
    // Inject section header when section changes
    if (a.section !== currentSection) {
      currentSection = a.section;
      const hdr = document.createElement('div');
      hdr.className = 'grid-section-header';
      hdr.textContent = a.section;
      grid.appendChild(hdr);
    }
    const card = document.createElement('div');
    card.className = 'artifact-card';
    card.innerHTML = `
      <div class="card-num">${a.num}</div>
      <div class="card-title">${a.title}</div>
      <div class="card-desc">${a.desc}</div>
      <span class="card-type">${a.type === 'mmd' ? 'mermaid' : 'markdown'}</span>
    `;
    card.addEventListener('click', () => {
      const navBtn = document.querySelector(`.nav-item[data-file="${a.file}"]`);
      if (a.type === 'mmd') loadMmd(navBtn, a.file, a.title);
      else loadDoc(navBtn, a.file, a.title, 'md');
    });
    grid.appendChild(card);
  });
}

function showWelcome(e) {
  if (e) e.preventDefault();
  loadWelcome(null);
}

// ── Markdown loader ──
async function loadDoc(navEl, filename, title, type) {
  const runId = nextRenderRun();
  setActive(navEl);
  showArea('md-area');
  byId('footer-file').textContent = filename;
  const content = byId('md-content');
  content.innerHTML = '<div class="loading-msg">Loading…</div>';

  try {
    const text = await fetchText(filename);
    if (!isCurrentRun(runId)) return;

    const rendered = renderMarkdownCached(filename, text);
    if (!isCurrentRun(runId)) return;

    content.innerHTML = rendered;
    highlightCodeBlocks(content);
    await renderInlineMermaidBlocks(content, runId);

    if (!isCurrentRun(runId)) return;
    byId('main').scrollTop = 0;
  } catch (err) {
    if (!isCurrentRun(runId)) return;
    content.innerHTML = `<div class="error-msg"><strong>Could not load ${escapeHtml(filename)}</strong><br>${escapeHtml(err.message)}<br><br>Make sure this page is served over HTTP (not file://) and that the file exists in the same directory as index.html.</div>`;
  }
}

// ── Mermaid loader ──
async function loadMmd(navEl, filename, title) {
  const runId = nextRenderRun();
  setActive(navEl);
  showArea('mmd-area');
  byId('content-area').classList.toggle('dataflow-mode', isDataFlowDiagram(filename));
  byId('footer-file').textContent = filename;
  byId('mmd-title').textContent = title;
  const loading = byId('mmd-loading');
  const render = byId('mmd-render');
  loading.style.display = '';
  render.innerHTML = '';

  try {
    const code = await fetchText(filename);
    if (!isCurrentRun(runId)) return;

    const key = `main:${filename}:${hashString(code)}`;
    const svg = await renderMermaidSvg(code, key);
    if (!isCurrentRun(runId)) return;

    loading.style.display = 'none';
    mountFitDiagram(render, svg);
    byId('main').scrollTop = 0;
  } catch (err) {
    if (!isCurrentRun(runId)) return;
    loading.style.display = 'none';
    render.innerHTML = `<div class="error-msg"><strong>Could not render ${escapeHtml(filename)}</strong><br>${escapeHtml(err.message)}<br><br>Make sure this page is served over HTTP and the .mmd file exists.</div>`;
  }
}

// ── Markdown / diagram render engine ──
function renderMarkdown(text, scope = 'markdown') {
  activeMarkdownScope = scope;
  activeMermaidIndex = 0;
  try {
    return marked.parse(text);
  } finally {
    activeMarkdownScope = 'markdown';
    activeMermaidIndex = 0;
  }
}

function renderMarkdownCached(filename, text) {
  const hash = hashString(text);
  const cached = markdownCache.get(filename);
  if (cached && cached.hash === hash) return cached.html;

  const html = renderMarkdown(text, `md:${filename}:${hash}`);
  markdownCache.set(filename, { hash, html });
  return html;
}

async function renderInlineMermaidBlocks(container, runId) {
  const blocks = Array.from(container.querySelectorAll('.mermaid-block'));
  if (!blocks.length || !mermaidReady) return;

  for (const block of blocks) {
    if (!isCurrentRun(runId)) return;

    const code = block.dataset.mmdCode || '';
    const key = block.dataset.mmdKey || `inline:${hashString(code)}`;
    try {
      const svg = await renderMermaidSvg(code, key);
      if (!isCurrentRun(runId)) return;
      mountFitDiagram(block, svg);
    } catch (err) {
      if (!isCurrentRun(runId)) return;
      block.innerHTML = `<pre style="color:#c0392b;font-size:12px">${escapeHtml(err.message)}</pre>`;
    }
  }
}

async function renderMermaidSvg(code, cacheKey) {
  const normalized = code.trim();
  const key = cacheKey || `mmd:${hashString(normalized)}`;

  if (mermaidSvgCache.has(key)) return mermaidSvgCache.get(key);
  if (mermaidPendingCache.has(key)) return mermaidPendingCache.get(key);

  const pending = Promise.resolve()
    .then(() => mermaid.render(`mmd-${hashString(key)}`, normalized))
    .then(({ svg }) => {
      mermaidSvgCache.set(key, svg);
      mermaidPendingCache.delete(key);
      return svg;
    })
    .catch(err => {
      mermaidPendingCache.delete(key);
      throw err;
    });

  mermaidPendingCache.set(key, pending);
  return pending;
}

function highlightCodeBlocks(container) {
  container.querySelectorAll('pre code').forEach(block => {
    if (!block.closest('.mermaid-block')) hljs.highlightElement(block);
  });
}

function mountFitDiagram(container, svg) {
  container.innerHTML = `<div class="diagram-fit">${svg}</div>`;
}

// ── Utilities ──
function byId(id) {
  if (!elementCache.has(id)) elementCache.set(id, document.getElementById(id));
  return elementCache.get(id);
}

function nextRenderRun() {
  renderRunId += 1;
  return renderRunId;
}

function isCurrentRun(runId) {
  return runId === renderRunId;
}

function getNavIndex() {
  if (navIndex) return navIndex;

  navIndex = Array.from(document.querySelectorAll('.nav-item')).map(el => {
    const label = el.querySelector('.nav-label')?.textContent || '';
    const num = el.querySelector('.nav-num')?.textContent || '';
    const file = el.dataset.file || '';
    return {
      el,
      searchText: `${label} ${num} ${file}`.toLowerCase(),
    };
  });
  return navIndex;
}

function fetchText(filename) {
  if (fetchCache.has(filename)) return fetchCache.get(filename);

  const pending = fetch(filename)
    .then(res => {
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
      return res.text();
    })
    .catch(err => {
      fetchCache.delete(filename);
      throw err;
    });

  fetchCache.set(filename, pending);
  return pending;
}

function hashString(str) {
  let hash = 2166136261;
  for (let i = 0; i < str.length; i++) {
    hash ^= str.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return (hash >>> 0).toString(36);
}

function isDataFlowDiagram(filename) {
  return /^open-design-df-\d+-.+\.mmd$/i.test(filename);
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function escapeAttr(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// ── Init ──
loadWelcome(null);
</script>
