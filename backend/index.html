<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Open Design — Engineering Docs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-theme" />
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  /* ── Design tokens ── */
  :root {
    --canvas:       #faf9f5;
    --card-bg:      #ffffff;
    --warm-surface: #f3f0e8;
    --coral:        #c96442;
    --coral-light:  #faece7;
    --coral-dark:   #993c1d;
    --navy:         #1c2333;
    --text-primary: #1a1916;
    --text-body:    #3d3a34;
    --text-muted:   #706d65;
    --text-faint:   #a09c94;
    --border:       rgba(28,35,51,0.09);
    --sidebar-w:    272px;
    --header-h:     58px;
    --radius:       8px;
    --shadow-sm:    0 1px 3px rgba(28,35,51,0.08), 0 1px 2px rgba(28,35,51,0.06);
    --shadow-md:    0 4px 12px rgba(28,35,51,0.10);
    --transition:   0.18s ease;
  }

  /* ── Reset / base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--canvas);
    color: var(--text-body);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Layout ── */
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ── Header ── */
  #header {
    position: sticky; top: 0; z-index: 100;
    height: var(--header-h);
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px;
    box-shadow: var(--shadow-sm);
  }
  #header-logo {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; flex-shrink: 0;
  }
  #header-logo svg { width: 28px; height: 28px; }
  #header-wordmark {
    font-family: 'Lora', serif;
    font-size: 15px; font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
  }
  #header-wordmark span {
    color: var(--text-muted);
    font-weight: 400;
  }
  #header-divider {
    width: 1px; height: 22px;
    background: var(--border);
    flex-shrink: 0;
  }
  #search-wrap {
    flex: 1; max-width: 320px;
    position: relative;
  }
  #search-wrap svg {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--text-faint); pointer-events: none;
  }
  #nav-search {
    width: 100%;
    padding: 7px 12px 7px 34px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--warm-surface);
    color: var(--text-body);
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  #nav-search:focus {
    border-color: var(--coral);
    box-shadow: 0 0 0 3px var(--coral-light);
    background: var(--card-bg);
  }
  #header-pills {
    display: flex; gap: 8px; flex-shrink: 0;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--warm-surface);
    border: 1px solid var(--border);
    font-size: 12px; font-weight: 500;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .pill-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--coral);
    flex-shrink: 0;
  }
  #header-github {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-body);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    text-decoration: none;
    transition: background var(--transition), border-color var(--transition);
    flex-shrink: 0;
  }
  #header-github:hover {
    background: var(--warm-surface);
    border-color: var(--text-muted);
  }

  /* ── Body layout ── */
  #body { display: flex; flex: 1; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--card-bg);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 0 32px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .nav-section-label {
    padding: 12px 18px 4px;
    font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    user-select: none;
  }
  .nav-section-label:not(:first-child) {
    margin-top: 8px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 18px;
    cursor: pointer;
    border-radius: 0;
    font-size: 13.5px;
    color: var(--text-body);
    transition: background var(--transition), color var(--transition);
    border: none; background: none;
    width: 100%; text-align: left;
    position: relative;
  }
  .nav-item:hover {
    background: var(--warm-surface);
    color: var(--text-primary);
  }
  .nav-item.active {
    background: var(--coral-light);
    color: var(--coral-dark);
    font-weight: 500;
  }
  .nav-item.active::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--coral);
    border-radius: 0 2px 2px 0;
  }
  .nav-item.hidden { display: none; }
  .nav-num {
    font-size: 11px; font-weight: 600;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
    min-width: 22px;
  }
  .nav-label { flex: 1; }
  .badge-new {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 10px;
    background: var(--coral);
    color: #fff;
    font-size: 9.5px; font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  /* ── Main content ── */
  #main {
    flex: 1; overflow-y: auto;
    padding: 0;
    display: flex; flex-direction: column;
  }
  #content-area {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 48px 80px;
    width: 100%;
  }

  /* ── Welcome screen ── */
  #welcome { }
  .welcome-hero {
    margin-bottom: 36px;
  }
  .welcome-hero h1 {
    font-family: 'Lora', serif;
    font-size: 28px; font-weight: 700;
    color: var(--text-primary);
    line-height: 1.25;
    margin-bottom: 10px;
  }
  .welcome-hero p {
    font-size: 15px;
    color: var(--text-muted);
    max-width: 560px;
    line-height: 1.6;
  }
  .reading-order-notice {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 18px;
    background: var(--coral-light);
    border: 1px solid rgba(201,100,66,0.2);
    border-radius: var(--radius);
    margin-bottom: 36px;
    font-size: 13.5px;
    color: var(--coral-dark);
    line-height: 1.55;
  }
  .reading-order-notice svg { flex-shrink: 0; margin-top: 1px; }
  .artifact-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .artifact-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    cursor: pointer;
    transition: box-shadow var(--transition), border-color var(--transition), transform var(--transition);
  }
  .artifact-card:hover {
    box-shadow: var(--shadow-md);
    border-color: rgba(201,100,66,0.25);
    transform: translateY(-1px);
  }
  .card-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 500;
    color: var(--text-faint);
    margin-bottom: 6px;
  }
  .card-title {
    font-family: 'Lora', serif;
    font-size: 15px; font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 6px;
    line-height: 1.3;
  }
  .card-desc {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
  }
  .card-type {
    display: inline-block;
    margin-top: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--warm-surface);
    font-size: 11px; font-weight: 500;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
  }
  .card-new { border-color: rgba(201,100,66,0.35); }
  .card-new .card-num { color: var(--coral); }

  /* ── Mermaid / diagram area ── */
  #mmd-area {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 24px;
    overflow-x: auto;
  }
  #mmd-title {
    font-family: 'Lora', serif;
    font-size: 20px; font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 20px;
  }
  #mmd-loading {
    text-align: center;
    padding: 60px 0;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* ── Markdown content ── */
  #md-content {
    /* rendered markdown lives here */
  }
  #md-content h1 {
    font-family: 'Lora', serif;
    font-size: 26px; font-weight: 700;
    color: var(--text-primary);
    margin: 0 0 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--border);
    line-height: 1.25;
  }
  #md-content h2 {
    font-family: 'Lora', serif;
    font-size: 20px; font-weight: 600;
    color: var(--text-primary);
    margin: 36px 0 12px;
    line-height: 1.3;
  }
  #md-content h3 {
    font-family: 'DM Sans', sans-serif;
    font-size: 15.5px; font-weight: 600;
    color: var(--text-primary);
    margin: 24px 0 8px;
    line-height: 1.35;
  }
  #md-content h4 {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 600;
    color: var(--text-muted);
    margin: 18px 0 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  #md-content p {
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--text-body);
    margin-bottom: 14px;
  }
  #md-content a {
    color: var(--coral);
    text-decoration: none;
    border-bottom: 1px solid var(--coral-light);
    transition: border-color var(--transition);
  }
  #md-content a:hover { border-bottom-color: var(--coral); }
  #md-content ul, #md-content ol {
    padding-left: 22px;
    margin-bottom: 14px;
  }
  #md-content li {
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--text-body);
    margin-bottom: 4px;
  }
  #md-content li > ul, #md-content li > ol { margin-top: 4px; margin-bottom: 4px; }
  #md-content blockquote {
    margin: 18px 0;
    padding: 12px 18px;
    border-left: 4px solid var(--coral);
    background: var(--coral-light);
    border-radius: 0 var(--radius) var(--radius) 0;
    color: var(--coral-dark);
    font-size: 14px;
    line-height: 1.6;
  }
  #md-content blockquote p {
    color: var(--coral-dark);
    margin-bottom: 0;
    font-size: 14px;
  }
  #md-content hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 32px 0;
  }
  #md-content table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    margin-bottom: 20px;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
  }
  #md-content th {
    background: var(--warm-surface);
    padding: 9px 14px;
    text-align: left;
    font-weight: 600;
    color: var(--text-primary);
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border);
  }
  #md-content td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text-body);
    vertical-align: top;
  }
  #md-content tr:last-child td { border-bottom: none; }
  #md-content tr:nth-child(even) td { background: rgba(243,240,232,0.3); }
  #md-content code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    background: var(--warm-surface);
    color: var(--coral-dark);
    padding: 1px 5px;
    border-radius: 3px;
    border: 1px solid var(--border);
  }
  #md-content pre {
    background: var(--navy) !important;
    border-radius: var(--radius);
    padding: 20px 22px;
    margin: 16px 0 20px;
    overflow-x: auto;
    box-shadow: var(--shadow-sm);
  }
  #md-content pre code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.6;
    background: none !important;
    color: #e2e8f0 !important;
    padding: 0;
    border: none;
  }
  /* Mermaid blocks inside markdown */
  #md-content .mermaid-block {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin: 20px 0;
    overflow-x: auto;
    text-align: center;
  }

  /* ── Loading / error states ── */
  .loading-msg {
    text-align: center; padding: 80px 0;
    color: var(--text-muted); font-size: 14px;
  }
  .error-msg {
    padding: 24px;
    background: #fff2f0;
    border: 1px solid #ffa39e;
    border-radius: var(--radius);
    color: #820014;
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── Footer ── */
  #footer {
    padding: 14px 48px;
    border-top: 1px solid var(--border);
    background: var(--card-bg);
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
  }
  .footer-left {
    display: flex; align-items: center; gap: 16px;
    font-size: 12px;
    color: var(--text-faint);
  }
  .footer-sep { color: var(--border); }
  .footer-active-file {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--text-faint);
  }

  /* ── Highlight.js dark theme override ── */
  .hljs {
    background: var(--navy) !important;
    color: #e2e8f0 !important;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(112,109,101,0.35); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(112,109,101,0.55); }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    #content-area { padding: 28px 24px 60px; }
    #footer { padding: 12px 24px; }
  }
  @media (max-width: 640px) {
    #sidebar { display: none; }
    #header-pills { display: none; }
    #header-github { display: none; }
  }
</style>
</head>

      GitHub

function filterNav(q) {
  const query = q.toLowerCase().trim();
  document.querySelectorAll('.nav-item').forEach(btn => {

    const label = (btn.querySelector('.nav-label')?.textContent || '').toLowerCase();
    const num = (btn.querySelector('.nav-num')?.textContent || '').toLowerCase();
    const file = (btn.dataset.file || '').toLowerCase();
    btn.classList.toggle('hidden', !label.includes(query) && !num.includes(query) && !file.includes(query));
  });
}

// ── Markdown loader ──
async function loadDoc(navEl, filename, title, type) {
  setActive(navEl);
  showArea('md-area');
  document.getElementById('footer-file').textContent = filename;
  const content = document.getElementById('md-content');
  content.innerHTML = '<div class="loading-msg">Loading…</div>';

  try {
    const res = await fetch(filename);
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
    const text = await res.text();
    const rendered = await renderMarkdown(text);
    content.innerHTML = rendered;
    // Syntax highlight
    content.querySelectorAll('pre code').forEach(block => {
      // Skip mermaid blocks — they are handled separately
      if (!block.closest('.mermaid-block')) {
        hljs.highlightElement(block);
      }
    });
    // Render mermaid blocks
    const mmdBlocks = content.querySelectorAll('.mermaid-block');
    if (mmdBlocks.length > 0 && mermaidReady) {
      for (let i = 0; i < mmdBlocks.length; i++) {
        const block = mmdBlocks[i];
        const code = block.dataset.mmdCode;
        try {
          const id = 'mmd-inline-' + Date.now() + '-' + i;
          const { svg } = await mermaid.render(id, code);
          block.innerHTML = svg;
        } catch (err) {
          block.innerHTML = `<pre style="color:#c0392b;font-size:12px">${escapeHtml(err.message)}</pre>`;
        }
      }
    }
    // Scroll to top
    document.getElementById('main').scrollTop = 0;
  } catch (err) {
    content.innerHTML = `<div class="error-msg"><strong>Could not load ${escapeHtml(filename)}</strong><br>${escapeHtml(err.message)}<br><br>Make sure this page is served over HTTP (not file://) and that the file exists in the same directory as index.html.</div>`;
  }
}

// ── Mermaid loader ──
async function loadMmd(navEl, filename, title) {
  setActive(navEl);
  showArea('mmd-area');
  document.getElementById('footer-file').textContent = filename;
  document.getElementById('mmd-title').textContent = title;
  const loading = document.getElementById('mmd-loading');
  const render = document.getElementById('mmd-render');
  loading.style.display = '';
  render.innerHTML = '';

  try {
    const res = await fetch(filename);
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
    const code = await res.text();
    loading.style.display = 'none';
    const id = 'mmd-main-' + Date.now();
    const { svg } = await mermaid.render(id, code.trim());
    render.innerHTML = svg;
    document.getElementById('main').scrollTop = 0;
  } catch (err) {
    loading.style.display = 'none';
    render.innerHTML = `<div class="error-msg"><strong>Could not render ${escapeHtml(filename)}</strong><br>${escapeHtml(err.message)}<br><br>Make sure this page is served over HTTP and the .mmd file exists.</div>`;
  }
}

// ── Markdown renderer with mermaid interception ──
async function renderMarkdown(text) {
  // Custom renderer to intercept mermaid code blocks
  const renderer = new marked.Renderer();
  const mermaidBlocks = [];

  renderer.code = function(code, lang) {
    if (lang === 'mermaid') {
      const idx = mermaidBlocks.length;
      mermaidBlocks.push(code);
      return `<div class="mermaid-block" data-mmd-index="${idx}" data-mmd-code="${escapeAttr(code)}"><div style="color:var(--text-muted);font-size:13px;padding:20px">Rendering diagram…</div></div>`;
    }
    // Dark code block
    const langClass = lang ? ` class="language-${escapeHtml(lang)}"` : '';
    return `<pre><code${langClass}>${escapeHtml(code)}</code></pre>`;
  };

  marked.use({ renderer });
  return marked.parse(text);
}

// ── Utilities ──
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function escapeAttr(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}
